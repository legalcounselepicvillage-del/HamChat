<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b55">
  <title>HamChat — دردشة بسيطة</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">H</div>
      <div>
        <h1>HamChat</h1>
        <p>دردشتك، ببساطة</p>
      </div>
      <span class="connection" id="connection-status">غير متصل</span>
      <button class="text-button logout-button hidden" id="logout-button" type="button">تسجيل الخروج</button>
    </header>

    <section class="panel join-panel auth-panel" id="auth-panel" aria-labelledby="welcome-title">
      <div class="intro-icon" aria-hidden="true">✦</div>
      <h2 id="welcome-title">أهلاً بك في HamChat</h2>
      <p class="muted">سجل الدخول أو أنشئ حساباً للانضمام إلى الدردشة.</p>
      <div class="auth-tabs" role="tablist" aria-label="نوع الحساب">
        <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true">تسجيل الدخول</button>
        <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false">إنشاء حساب</button>
      </div>
      <form id="login-form">
        <label for="login-email">البريد الإلكتروني</label>
        <input id="login-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="name@example.com" required>
        <label for="login-password">كلمة المرور</label>
        <input id="login-password" name="password" type="password" minlength="10" maxlength="72" autocomplete="current-password" required>
        <button class="primary-button" type="submit">تسجيل الدخول <span aria-hidden="true">←</span></button>
      </form>
      <form id="register-form" class="hidden">
        <label for="register-username">الاسم الظاهر</label>
        <input id="register-username" name="username" minlength="2" maxlength="24" autocomplete="nickname" placeholder="مثال: نور" required>
        <label for="register-email">البريد الإلكتروني</label>
        <input id="register-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="name@example.com" required>
        <label for="register-password">كلمة المرور <span class="label-hint">10 أحرف على الأقل</span></label>
        <input id="register-password" name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
        <button class="primary-button" type="submit">إنشاء حساب <span aria-hidden="true">←</span></button>
      </form>
      <p class="form-error" id="auth-error" role="alert"></p>
    </section>

    <section class="panel join-panel hidden" id="join-panel" aria-labelledby="join-title">
      <div class="intro-icon" aria-hidden="true">✦</div>
      <h2 id="join-title">مرحباً <span id="welcome-name"></span></h2>
      <p class="muted">اختر غرفة وابدأ الحديث.</p>
      <form id="join-form">
        <label for="room-input">اسم الغرفة</label>
        <input id="room-input" name="room" maxlength="32" value="عام" placeholder="مثال: عام" required>
        <button class="primary-button" type="submit">دخول إلى الدردشة <span aria-hidden="true">←</span></button>
      </form>
      <p class="form-error" id="join-error" role="alert"></p>
    </section>

    <section class="panel chat-panel hidden" id="chat-panel" aria-label="الدردشة">
      <div class="chat-heading">
        <div>
          <span class="eyebrow">أنت الآن في</span>
          <h2># <span id="room-name">عام</span></h2>
        </div>
        <button class="text-button" id="change-room" type="button">تغيير الغرفة</button>
      </div>
      <ol class="messages" id="messages" aria-live="polite" aria-relevant="additions"></ol>
      <form class="message-form" id="message-form">
        <label class="visually-hidden" for="message-input">اكتب رسالتك</label>
        <input id="message-input" maxlength="1000" autocomplete="off" placeholder="اكتب رسالة..." required>
        <button class="send-button" type="submit" aria-label="إرسال الرسالة">إرسال</button>
      </form>
    </section>
    <footer>HamChat · تواصل بلطف واحترام</footer>
  </main>
</body>
</html>
